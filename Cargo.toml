[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/oxihep/oxiroot"
homepage = "https://oxihep.github.io/oxiroot/"

[workspace.lints.rust]
# Pure-safe-Rust library: the only `unsafe` is the feature-gated mmap in
# oxiroot-io-core (scoped `#[allow]` + SAFETY note). Deny keeps it that way.
unsafe_code = "deny"
missing_docs = "warn"
# A borrowed type says so where it is named: `&mut RBuffer<'_>`.
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
all = "warn"
# Casts that can lose information: fixed (`From`, `try_from`) or justified
# where they stand. `cast_precision_loss` stays off: the integer → f64 casts
# are counts and bin indices, exact below 2⁵³.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
# A curated part of `clippy::pedantic`: the lints this code base holds to.
use_self = "warn"
missing_errors_doc = "warn"
must_use_candidate = "warn"
doc_markdown = "warn"
missing_panics_doc = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
format_push_string = "warn"

[workspace.dependencies]
# Internal crates. `version` must match `workspace.package.version` above: a
# published crate's dependencies need one (`cargo publish` rejects bare paths).
oxiroot-io-core = { path = "crates/oxiroot-io-core", version = "0.11.0" }
oxiroot-compress = { path = "crates/oxiroot-compress", version = "0.11.0" }
oxiroot-linalg = { path = "crates/oxiroot-linalg", version = "0.11.0" }
oxiroot-rntuple = { path = "crates/oxiroot-rntuple", version = "0.11.0" }
oxiroot-hist = { path = "crates/oxiroot-hist", version = "0.11.0" }
oxiroot-hist-func = { path = "crates/oxiroot-hist-func", version = "0.11.0" }
oxiroot-tree = { path = "crates/oxiroot-tree", version = "0.11.0" }
oxiroot-dataset = { path = "crates/oxiroot-dataset", version = "0.11.0" }
# The facade's batteries-included defaults are for applications; the in-repo
# consumer (the CLI) opts in to what it needs. Default features must be turned
# off here: a member's own `default-features = false` is ignored for an
# inherited dependency.
oxiroot = { path = "crates/oxiroot", version = "0.11.0", default-features = false }
# The oxihep crates that moved out of this workspace, each in its own repository
# (github.com/oxihep). Until they are on crates.io they are git dependencies,
# pinned to a release tag; `version` is kept so the switch is dropping
# `git`/`tag`. Every crate here must name the same tag as oxifit and oxiplot do
# for their own dependencies (oxistats, oxifit), so Cargo resolves one copy.
oxistats = { git = "https://github.com/oxihep/oxistats", tag = "v0.2.0", version = "0.2.0" }
oxiparticle = { git = "https://github.com/oxihep/oxiparticle", tag = "v0.2.0", version = "0.2.0" }
oxifit = { git = "https://github.com/oxihep/oxifit", tag = "v0.9.0", version = "0.9.0" }
oxifit-formula = { git = "https://github.com/oxihep/oxifit", tag = "v0.9.0", version = "0.9.0" }
# Default features off: the crates that implement its data traits need none, and
# the facade's `plot` feature turns PNG output and TeX math back on.
oxiplot = { git = "https://github.com/oxihep/oxiplot", tag = "v0.12.0", version = "0.12.0", default-features = false }
# The ROOT-free histogram library; oxiroot-hist converts its histograms to and
# from ROOT's.
oxihist = { git = "https://github.com/oxihep/oxihist", tag = "v0.16.0", version = "0.16.0" }
bytes = "1"
# Pure-Rust blocking HTTP client (rustls, no OpenSSL), for the optional `http`
# remote-read feature. `default-features = false` drops gzip transfer decoding,
# which would break byte-range semantics on a compressed response.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# TLS for the optional `xrootd-tls` feature (`roots://`, token auth): the same
# rustls + ring stack ureq already uses, and the Mozilla root store. Grid CAs
# come from `$X509_CERT_DIR` at run time.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# The effective uid, for the WLCG token locations (`bt_u<uid>`).
rustix = { version = "1", default-features = false, features = ["std", "process"] }
proptest = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
