[package]
name = "oxiroot-io-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["root", "cern", "hep", "tfile", "physics"]
categories = ["science", "parser-implementations", "encoding"]
description = "Core ROOT (TFile) container and buffer primitives"

[dependencies]
oxiroot-compress = { workspace = true }
bytes = { workspace = true }
memmap2 = { version = "0.9", optional = true }
ureq = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true }

[features]
# Opt-in memory-mapped read path (`FileReader::open_mmap`). Off by default so the
# default build stays pure safe Rust with no extra dependencies.
mmap = ["dep:memmap2"]
# Opt-in remote reads over HTTP(S) byte-range requests (`FileReader::open_url`). Off
# by default so the default build pulls no networking/TLS stack.
http = ["dep:ureq"]
# Opt-in remote reads over the XRootD `root://` protocol (`FileReader::open_url`).
# Pure `std::net` (unix auth, no crypto) — adds no dependencies.
xrootd = []
# TLS for XRootD: `roots://` URLs, servers that require TLS, and token (`ztn`)
# authentication with a WLCG bearer token. Adds rustls (ring) and the Mozilla
# root store; grid CAs are read from `$X509_CERT_DIR`.
xrootd-tls = ["xrootd", "dep:rustls", "dep:webpki-roots", "dep:rustix"]

# Render every read path (mmap, http) in the docs.rs API reference.
[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
