[package]
name = "oxiroot-compress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["root", "cern", "hep", "zstd", "lz4"]
categories = ["compression", "science"]
description = "ROOT compression block framing and codecs"

[dependencies]
miniz_oxide = "0.9.1"
# Pure, safe Rust Zstandard (`forbid(unsafe_code)`), within about 1.25x of C
# zstd's speed both ways and with its compression ratio.
# Pinned exactly: `zstd_encode` calls `zrip::encode::strategy::level_params_for_size`,
# which zrip hides from its docs and may change in a patch release.
zrip = "=0.8.22"
# zrip's own crates, pinned to the versions zrip 0.8.22 was released with. zrip
# asks for them with caret ranges, and their patch releases have moved to new
# `zrip-core` minors: `zrip-decode 0.8.18` needs `zrip-core 0.14` where zrip
# 0.8.22 needs 0.12, so a fresh resolution put two `zrip-core`s in one build
# and zrip stopped compiling. Not used directly; move these with `zrip`.
zrip-decode = { version = "=0.8.16", default-features = false }
zrip-encode = { version = "=0.9.10", default-features = false }
lz4_flex = { version = "0.14", default-features = false, features = ["alloc", "safe-encode", "safe-decode", "checked-decode"] }
# Pure-Rust LZMA/XZ (tukaani xz-for-java port). Both directions: `xz` gives the
# decoder, `encoder` the compressor. `optimization` improves the ratio.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder", "optimization"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
# Pins only: see `zrip-decode` above.
ignored = ["zrip-decode", "zrip-encode"]
