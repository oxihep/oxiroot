[package]
name = "oxiroot-hist-func"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["root", "cern", "hep", "tf1", "function"]
categories = ["science", "mathematics"]
description = "ROOT parametric functions (TF1/TF2/TF3) evaluated in pure Rust, with ROOT read/write"

[dependencies]
oxiroot-hist = { workspace = true }
oxiroot-io-core = { workspace = true }
oxifit-formula = { workspace = true }
oxifit = { workspace = true, optional = true }

[features]
# Opt-in fitting: `Func1D/2D/3D::to_model` turn a function into an
# `oxifit::Model`, and histograms become fittable (`oxiroot-hist/fit`).
fit = ["dep:oxifit", "oxiroot-hist/fit"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
