name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: the latest stable Rust, the latest ROOT image, and a short fuzz
  # campaign. Never gates a PR; a failure here is a heads-up to act on.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Read-only token by default. Two jobs ask for more: `coverage` comments on
# its PR, and the weekly `bench` run pushes its results to the `bench-data`
# branch.
permissions:
  contents: read

# A new push to a PR cancels its previous run; main runs every push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The toolchain every "stable" job uses. Pinned so a new Rust release (new
  # lints under -D warnings, rustfmt changes) cannot break main on its own;
  # bump it in a PR (see RELEASING.md). The scheduled job tests the latest stable.
  RUST_STABLE: "1.100"

jobs:
  test:
    name: test / lint / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Test (plotting feature combos)
        # `cargo test --workspace` builds the facade with its default features.
        # Also run the histogram crate's oxiplot impls (its `plot` feature) and
        # the facade with `plot,fit` (the high-level `tests/plot.rs`, which only
        # compiles under the `plot` feature).
        run: |
          cargo test --locked -p oxiroot-hist --features plot
          cargo test --locked -p oxiroot --features plot,fit

      - name: Run examples (smoke)
        # The showcase examples drive the method-based read/write API end to end —
        # FileWriter (multi-object, subdirectory, append), read_root_in,
        # Tree/Ntuple::write_root, and nested RNTuple round-trips — so a regression
        # in any of them fails CI (each asserts against its own written output).
        run: |
          cargo run --locked -q -p oxiroot --example analysis
          cargo run --locked -q -p oxiroot --example tree
          cargo run --locked -q -p oxiroot --example rntuple_nested
          cargo run --locked -q -p oxiroot --example plot --features plot,fit

      - name: Run the analysis examples (release)
        # Complete analyses — a TTree in, fits, toys, plots and a ROOT file
        # out — each a few seconds in release (far longer in debug).
        run: |
          cargo run --locked -q --release -p oxiroot --example resonance_search
          cargo run --locked -q --release -p oxiroot --example template_fit
          cargo run --locked -q --release -p oxiroot --example splot_lifetime
          cargo run --locked -q --release -p oxiroot --example tag_and_probe

  macos:
    name: test (macOS)
    # The mmap path, file locking and path handling differ from Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test with all features
        run: cargo test --locked --workspace --all-features

  latest-stable:
    name: latest stable Rust (weekly)
    # The pinned toolchain keeps PRs reproducible; this catches what the next
    # bump will bring (new lints, deprecations) before it is due.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the latest stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy with all features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test with all features
        run: cargo test --locked --workspace --all-features

  bench:
    name: benchmarks
    # Compile-only on PRs, so the benches keep building. The weekly run
    # measures them, keeps criterion's report as an artifact, and adds the
    # numbers to the history on the `bench-data` branch (charted on the docs
    # site under /bench/). A result 1.5x slower than the last run gets a
    # comment on the commit; shared runners are too noisy to fail on it.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the benches
        run: cargo bench --locked -p oxiroot --features rayon --bench fill --bench read --bench write --bench decompress --no-run

      - name: Run the benches (weekly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # The benches by name: a bare `cargo bench -p oxiroot` also runs the
        # library's libtest harness, which rejects criterion's options. The
        # bencher format is what the tracking action reads.
        run: |
          set -o pipefail
          cargo bench --locked -p oxiroot --features rayon --bench fill --bench read --bench write --bench decompress \
            -- --warm-up-time 1 --measurement-time 3 --output-format bencher | tee bench.txt

      - name: Keep the criterion report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: criterion
          path: target/criterion

      - name: Create the bench-data branch on the first run
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          if ! git ls-remote --exit-code --heads origin bench-data >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch --orphan bench-data
            git commit --allow-empty -m "Benchmark history"
            git push origin bench-data
            git switch -
          fi

      - name: Add the results to the history
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: oxiroot
          tool: cargo
          output-file-path: bench.txt
          gh-pages-branch: bench-data
          benchmark-data-dir-path: bench
          auto-push: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: "150%"
          comment-on-alert: true
          fail-on-alert: false

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: clippy

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Each crate with no features, and with each feature alone
        # Catches a feature that only compiles alongside another one. Features
        # must add API, never change it, so every combination has to build.
        # Not --locked: --no-dev-deps edits the manifests while it runs, which
        # changes the lockfile it would otherwise check against.
        run: cargo hack check --workspace --each-feature --no-dev-deps

      - name: Clippy with all features
        # The only job that compiles the `http` and `xrootd` remote-read paths.
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test with all features
        run: cargo test --locked --workspace --all-features

      - name: Test the facade with no default features
        run: cargo test --locked -p oxiroot --no-default-features

      - name: Histogram-only builds do not compile the formula engine
        # TF1/TF2/TF3 live in oxiroot-hist-func so that oxiroot-hist (with or
        # without its `plot` feature) stays free of oxifit-formula.
        run: |
          set -euo pipefail
          hist=$(cargo tree -p oxiroot-hist -e normal)
          hist_plot=$(cargo tree -p oxiroot-hist -e normal --features plot)
          if grep -E 'oxifit-formula|oxiroot-hist-func' <<<"$hist"; then
            echo "oxiroot-hist must not depend on the formula engine"; exit 1
          fi
          if grep oxifit <<<"$hist_plot"; then
            echo "oxiroot-hist with plot must not depend on oxifit"; exit 1
          fi

  oxihep-lockstep:
    name: oxihep crates resolve once
    # Every oxihep crate must come from a single git tag. If oxiroot and, say,
    # oxifit name different oxistats tags, Cargo builds two oxistats and their
    # types stop being interchangeable (see RELEASING.md). `cargo tree
    # --duplicates` lists any crate built from more than one source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: No oxihep crate is built twice
        run: |
          set -euo pipefail
          dups=$(cargo tree --locked --workspace --all-features --duplicates -e normal,build,dev --depth 0 --prefix none --format '{p}' | grep -E '^oxi(hist|plot|plot-tex|fit|fit-formula|stats|particle) ' || true)
          if [ -n "$dups" ]; then
            echo "These oxihep crates resolve to more than one tag; bump every manifest to the same tag:"
            echo "$dups" | sort -u
            exit 1
          fi

  coverage:
    name: coverage
    # Line coverage of the workspace's tests (cargo-llvm-cov). On a PR, the
    # changed lines must be at least 80 % covered (diff-cover), and a comment
    # on the PR shows which are not. The coverage of main is published with
    # the docs site (docs.yml), which the README badge reads.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # diff-cover compares the PR with its base branch.
          fetch-depth: 0

      - name: Install the pinned stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Measure coverage
        run: |
          cargo llvm-cov --locked --workspace --all-features --no-report
          cargo llvm-cov report --cobertura --output-path coverage.xml
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --summary-only | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage of the changed lines
        id: diff
        run: |
          pipx install --quiet diff-cover
          diff-cover coverage.xml --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=80 --format markdown:diff-cover.md
        continue-on-error: true

      - name: Comment on the PR
        # A PR from a fork gets a read-only token: no comment, the summary
        # below still shows it.
        if: always() && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('diff-cover.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: diff-cover.md

      - name: Fail when the changed lines are under 80 % covered
        run: |
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          test "${{ steps.diff.outcome }}" = success

  unused-deps:
    name: unused dependencies (cargo-machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: No dependency is declared but unused
        run: cargo machete

  workflows:
    name: workflows (actionlint)
    # Syntax, expressions and the shell in every workflow, including those
    # that only run on main or on a tag (docs, release).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint the workflows
        # The official image, with shellcheck for the `run:` scripts.
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  spelling:
    name: spelling (typos)
    # Configured in _typos.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1

  supply-chain:
    name: supply chain (cargo-deny)
    # Known vulnerabilities (RustSec), yanked crates, and dependency sources
    # (crates.io, plus git only from github.com/oxihep). Configured in deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the workspace's declared rust-version
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features

  docs:
    name: API docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the docs, denying broken links
        run: cargo doc --locked --no-deps --all-features --workspace

      - name: Compile every Rust snippet of the guides and the README
        # Each page's blocks compile together, in order, against the facade
        # with all features. A block that is a fragment on purpose is marked
        # with `<!-- fragment -->` on the line before its fence.
        run: python3 scripts/check_guide_snippets.py

  package:
    name: package (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Package and verify every publishable crate
        # Builds each crate from its packaged sources, resolving the others
        # through a temporary local registry, so a missing file, a git
        # dependency, or a dependency without a version fails here instead of
        # at release.
        #
        # While the oxihep crates are git dependencies (not yet on crates.io)
        # nothing here can be packaged, so the step is skipped with a notice.
        # It runs again as soon as the workspace has no `git =` dependency.
        run: |
          if grep -Eq '^[a-z0-9_-]+ = \{[^}]*git = ' Cargo.toml; then
            echo "::notice title=package skipped::the workspace has git dependencies (unpublished oxihep crates); cargo package needs them on crates.io"
            exit 0
          fi
          cargo package --locked --workspace

  fuzz-build:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Build fuzz targets
        working-directory: fuzz
        # Compile-only on every PR: keeps the harness from rotting against API
        # changes. The weekly run below fuzzes for real.
        run: cargo +nightly fuzz build

      - name: Fuzz each target for 2 minutes (weekly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: fuzz
        # -rss_limit_mb turns an unbounded allocation (a length field taken on
        # trust) into a reported crash instead of an OOM-killed runner.
        run: |
          set -euo pipefail
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -max_total_time=120 -rss_limit_mb=2048
          done

      - name: Keep any crash input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  interop-uproot:
    name: interop (uproot)
    # Round-trip against uproot (the Python ROOT-IO library): Rust writes a
    # histogram + RNTuple + TTree + a FileWriter-built multi-object/subdirectory
    # file + an appended file, all of which uproot reads; uproot writes a
    # histogram + TTree + a subdirectory file that Rust reads (the subdirectory
    # via read_root_in). (uproot's TTree writer can't emit std::vector, so that
    # branch is exercised only in the ROOT C++ job.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uproot
        # lz4 + xxhash and zstandard let uproot read the LZ4 and Zstd files.
        run: pip install uproot numpy awkward lz4 xxhash zstandard

      - name: Build interop driver
        run: cargo build --locked -p oxiroot --example interop

      - name: Rust writes → uproot reads
        run: |
          mkdir -p /tmp/interop
          cargo run --locked -q -p oxiroot --example interop -- write /tmp/interop
          python scripts/interop_uproot.py read /tmp/interop

      - name: uproot writes → Rust reads
        run: |
          python scripts/interop_uproot.py write /tmp/interop
          cargo run --locked -q -p oxiroot --example interop -- read /tmp/interop

      - name: Manifest matrix (Rust writes → uproot reads)
        # Every histogram type, codec, tree and RNTuple shape in the manifest.
        run: |
          cargo run --locked -q -p oxiroot --example interop_matrix -- write /tmp/matrix
          python scripts/interop_matrix_uproot.py /tmp/matrix

  interop-root:
    name: interop (ROOT C++)
    # Round-trip against an official ROOT build: ROOT C++ writes a histogram +
    # RNTuple + TTree (incl. a std::vector branch) + a subdirectory file that
    # Rust reads (the subdirectory via read_root_in), and Rust writes a histogram
    # + RNTuple + TTree + a FileWriter-built multi-object/subdirectory file + an
    # appended file that ROOT C++ reads. The TTree covers scalar, fixed array,
    # string, jagged, and std::vector branches both ways, and 2-D/3-D histograms
    # and a profile under every codec. PRs use a pinned image, so a new ROOT
    # release cannot break them; the weekly run uses the latest one.
    runs-on: ubuntu-latest
    container: rootproject/root:${{ github.event_name == 'schedule' && 'latest' || '6.38.00-ubuntu25.10' }}
    # The container runs as root; align HOME with root's actual home so rustup
    # doesn't mistake the GitHub-set HOME for a sudo invocation, and so the
    # toolchain it installs is found by later steps. Applies to every step.
    #
    # That HOME also reaches the host-side `docker exec` the runner uses to run
    # each step, so its docker CLI tries to read root's ~/.docker/config.json
    # (unreadable by the runner user) and prints a benign "permission denied"
    # warning. Point DOCKER_CONFIG at an empty dir so docker finds no config and
    # stays quiet — it doesn't need one here (the image is already pulled).
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain ${{ env.RUST_STABLE }}
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build interop driver
        run: cargo build --locked -p oxiroot --example interop

      - name: Build ROOT C++ oracle
        # root-config's flags are meant to be split into words.
        run: |
          # shellcheck disable=SC2046
          c++ $(root-config --cflags) scripts/interop_root.cpp $(root-config --libs) -lROOTNTuple -o /tmp/interop_root

      - name: ROOT C++ writes → Rust reads
        run: |
          mkdir -p /tmp/interop
          /tmp/interop_root write /tmp/interop
          cargo run --locked -q -p oxiroot --example interop -- read /tmp/interop

      - name: Rust writes → ROOT C++ reads
        run: |
          cargo run --locked -q -p oxiroot --example interop -- write /tmp/interop
          /tmp/interop_root read /tmp/interop

      - name: Manifest matrix (Rust writes → ROOT C++ reads)
        # Every histogram type, codec, tree and RNTuple shape in the manifest.
        run: |
          # The std::map RNTuple case needs the map's dictionary.
          rootcling -f /tmp/rntuple_map_dict.cxx scripts/rntuple_map_LinkDef.h
          # shellcheck disable=SC2046
          c++ $(root-config --cflags) -I scripts scripts/interop_matrix_root.cpp /tmp/rntuple_map_dict.cxx $(root-config --libs) -lROOTNTuple -o /tmp/interop_matrix_root
          cargo run --locked -q -p oxiroot --example interop_matrix -- write /tmp/matrix
          /tmp/interop_matrix_root /tmp/matrix
