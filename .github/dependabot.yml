# Weekly dependency update PRs. The oxihep git dependencies are not tracked
# here: they move in lockstep by hand (see RELEASING.md).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        exclude-patterns: ["oxi*"]
    ignore:
      - dependency-name: "oxi*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
